<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTC Equity Trades</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>OTC Equity Trades</h1>
    <span id="freshness" class="muted"></span>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="field">
      <label>Date range</label>
      <select id="f-preset">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last year</option>
        <option value="all">All history</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div class="field" id="custom-dates" hidden>
      <label>From / to</label>
      <span><input type="date" id="f-from"> <input type="date" id="f-to"></span>
    </div>
    <div class="field grow">
      <label for="f-underlier">Underlier</label>
      <input type="text" id="f-underlier" placeholder="e.g. S&amp;P 500 INDEX" autocomplete="off">
      <div id="ac" class="ac" hidden></div>
    </div>
    <div class="field">
      <label>Product (FISN)</label>
      <span class="colpick">
        <button id="fisn-btn">All ▾</button>
        <div id="fisn-menu" class="ac colmenu left" hidden></div>
      </span>
    </div>
    <div class="field">
      <label for="f-status">Status</label>
      <select id="f-status">
        <option value="active,terminated" selected>Active + terminated</option>
        <option value="active">Active only</option>
        <option value="active,terminated,error">Include errors</option>
      </select>
    </div>
    <div class="field">
      <label>Notional</label>
      <span>
        <input type="text" id="f-notional-min" class="num" placeholder="min · 10m">
        <input type="text" id="f-notional-max" class="num" placeholder="max">
      </span>
    </div>
    <div class="field">
      <label>Tenor (yrs)</label>
      <span>
        <input type="text" id="f-tenor-min" class="num numsm" placeholder="min">
        <input type="text" id="f-tenor-max" class="num numsm" placeholder="max">
      </span>
    </div>
    <div class="field">
      <label for="f-ccy">Notional ccy</label>
      <select id="f-ccy"><option value="">All</option></select>
    </div>
  </section>

  <section class="tiles" id="tiles" aria-label="Summary"></section>

  <section class="card">
    <div class="card-head">
      <h2 id="chart-title">Daily volume</h2>
      <div class="seg" role="tablist" aria-label="Chart metric">
        <button class="seg-btn active" data-metric="sum_notional">Notional</button>
        <button class="seg-btn" data-metric="n_trades">Trade count</button>
      </div>
    </div>
    <div id="chart" class="chart"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Aggregate</h2>
      <div class="field inline">
        <label for="agg-by">Group by</label>
        <select id="agg-by">
          <option value="underlier_name" selected>Underlier</option>
          <option value="execution_date">Day</option>
          <option value="week">Week</option>
          <option value="month">Month</option>
          <option value="upi_fisn">Product (FISN)</option>
          <option value="platform_id">Platform</option>
          <option value="notional_ccy_leg1">Currency</option>
          <option value="option_type">Option type</option>
          <option value="status">Status</option>
        </select>
      </div>
    </div>
    <div class="table-wrap"><table id="agg-table"></table></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Trades <span id="trade-count" class="muted"></span></h2>
      <div class="pager">
        <button id="csv-btn" title="Download all filtered rows (visible columns) as CSV">⬇ CSV</button>
        <span class="colpick">
          <button id="col-btn">Columns ▾</button>
          <div id="col-menu" class="ac colmenu" hidden></div>
        </span>
        <label class="muted" for="pg-size">Rows</label>
        <select id="pg-size">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
        <button id="pg-prev">‹ Prev</button>
        <span id="pg-info" class="muted"></span>
        <button id="pg-next">Next ›</button>
      </div>
    </div>
    <div class="table-wrap"><table id="trades-table"></table></div>
  </section>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
